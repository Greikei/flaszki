<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrona Informatyka - Fiszki i Test</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --correct: #22c55e;
            --wrong: #ef4444;
            --known: #10b981;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header { text-align: center; margin-bottom: 15px; }
        
        .stats-box {
            background: white; padding: 15px 25px; border-radius: 12px;
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.05); margin-bottom: 20px;
            display: flex; gap: 20px; font-weight: bold; border: 1px solid #e2e8f0;
        }
        .stats-box .known { color: var(--known); }
        .stats-box .unknown { color: var(--wrong); }

        .mode-switch { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center;}
        
        button {
            padding: 10px 20px; border: none; border-radius: 8px;
            background: var(--primary); color: white; cursor: pointer;
            font-size: 15px; font-weight: bold; transition: background 0.2s;
        }
        button:hover { background: var(--primary-hover); }
        .mode-switch button { background: #cbd5e1; color: var(--text); }
        .mode-switch button.active { background: var(--primary); color: white; }
        .mode-switch button.filter-btn { background: #fde047; color: #854d0e; }
        .mode-switch button.filter-btn.active { background: #eab308; color: white; }
        
        /* Fiszki */
        .flashcard-container {
            perspective: 1000px; width: 100%; max-width: 600px; height: 380px;
            margin-bottom: 20px;
        }
        .flashcard {
            width: 100%; height: 100%; position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; cursor: pointer;
        }
        .flashcard.is-flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%;
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            background: var(--card-bg); border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; padding: 30px; box-sizing: border-box; text-align: center;
        }
        .card-back { transform: rotateY(180deg); text-align: left; align-items: flex-start; overflow-y: auto;}
        .card-title { font-size: 14px; color: #64748b; margin-bottom: 15px; text-transform: uppercase; font-weight: 600; letter-spacing: 1px;}
        .card-content { font-size: 20px; font-weight: 500; }
        .card-back .card-content { font-size: 17px; font-weight: 400; line-height: 1.6;}
        
        /* Test ABCD */
        .test-container {
            width: 100%; max-width: 600px; display: none;
            background: var(--card-bg); padding: 30px; border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); box-sizing: border-box;
        }
        .options-grid { display: grid; gap: 10px; margin-top: 20px; }
        .option-btn {
            background: #f1f5f9; color: var(--text); text-align: left;
            padding: 15px; font-size: 15px; font-weight: normal; border-radius: 8px;
        }
        .option-btn:hover:not(:disabled) { background: #e2e8f0; }
        .option-btn.correct { background: var(--correct); color: white; }
        .option-btn.wrong { background: var(--wrong); color: white; }
        
        .controls { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;}
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Obrona - Informatyka</h1>
    </div>

    <div class="stats-box">
        <div class="known">✔ Umiesz: 27</div>
        <div class="unknown">📝 Do nauki: 40</div>
    </div>

    <div class="mode-switch">
        <button id="btn-filter" class="filter-btn active" onclick="toggleFilter()">Tylko to, czego nie umiem</button>
        <button id="btn-mode-flashcards" class="active" onclick="switchMode('flashcards')">Fiszki</button>
        <button id="btn-mode-test" onclick="switchMode('test')">Test ABCD</button>
    </div>

    <!-- Sekcja Fiszek -->
    <div id="flashcards-section">
        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <div class="card-title" id="fc-title">Pytanie 1</div>
                    <div class="card-content" id="fc-question">Ładowanie...</div>
                </div>
                <div class="card-face card-back">
                    <div class="card-title">Odpowiedź (Kliknij, aby odwrócić)</div>
                    <div class="card-content" id="fc-answer">Ładowanie...</div>
                </div>
            </div>
        </div>
        <div class="controls">
            <button onclick="prevQuestion()">&larr; Poprzednie</button>
            <button onclick="shuffleQuestions()">🔀 Losuj z puli</button>
            <button onclick="nextQuestion()">Następne &rarr;</button>
        </div>
        <p style="text-align:center; color:#64748b; font-size:12px; margin-top:15px;">Klawiatura: strzałki &larr; &rarr; oraz Spacja/Enter</p>
    </div>

    <!-- Sekcja Testu -->
    <div id="test-section" class="test-container hidden">
        <div class="card-title" id="test-title">Pytanie 1</div>
        <div class="card-content" id="test-question" style="font-weight:600; margin-bottom: 20px;">Ładowanie...</div>
        <div class="options-grid" id="test-options"></div>
        <div class="controls" style="margin-top: 20px;">
            <button id="test-next-btn" onclick="nextTestQuestion()" class="hidden">Następne pytanie &rarr;</button>
        </div>
    </div>

<script>
    // Twoja baza danych - 40 nieskreślonych pytań (isKnown: false) + kilka skreślonych jako przykłady
    const db = [
        // SKREŚLONE (dla spójności)
        { id: 1, isKnown: true, q: "Systemy liczbowe (liczenia), przykłady zapisu liczby w każdym z nich.", a: "Dziesiętny (0-9), Binarny (0-1), Ósemkowy (0-7), Szesnastkowy (0-9, A-F)." },
        { id: 2, isKnown: true, q: "Programowanie strukturalne i niestrukturalne.", a: "Niestrukturalne używa np. GOTO (skoki, spaghetti code). Strukturalne używa bloków, pętli (for, while) i warunków (if), kod jest czytelny." },
        
        // NIESKREŚLONE (Twoje do nauki)
        { id: 3, isKnown: false, q: "Rola wskaźników w programowaniu.", a: "Przechowują adresy fizyczne w pamięci operacyjnej. Umożliwiają m.in. dynamiczną alokację pamięci i przekazywanie zmiennych do funkcji przez referencję." },
        { id: 5, isKnown: false, q: "Jakie jest znaczenie asercji początkowej i końcowej algorytmu?", a: "Początkowa: warunki wejściowe (np. x musi być > 0), jakie muszą być spełnione przed startem. Końcowa: gwarantowany stan wyjściowy/wynik po poprawnym zakończeniu algorytmu." },
        { id: 7, isKnown: false, q: "Porównaj własności statycznej tablicy z jednokierunkową listą wiązaną.", a: "Tablica: stały rozmiar, szybki dostęp do elementu O(1), ale wolne wstawianie w środku. Lista: rozmiar dynamiczny, wolniejszy dostęp do elementu O(n) (trzeba przejść po kolei), bardzo szybkie wstawianie/usuwanie z przepięciem wskaźników." },
        { id: 11, isKnown: false, q: "Rodzaje, charakterystyka i przeznaczenie rejestrów procesora.", a: "To najszybsza wewnętrzna pamięć CPU. Dzielą się na ogólnego przeznaczenia (dane bieżące) i specjalne (np. Licznik rozkazów PC - adres kolejnej instrukcji, Akumulator, Wskaźnik stosu)." },
        { id: 12, isKnown: false, q: "Istota pamięci wirtualnej, mechanizm tłumaczenia adresu.", a: "Rozszerza RAM używając przestrzeni na dysku twardym (plik wymiany). Programy 'widzą' ciągły adres wirtualny. Jednostka MMU tłumaczy ten wirtualny adres na fizyczny adres w RAM (lub na dysku) używając Tablicy Stron." },
        { id: 13, isKnown: false, q: "Czynniki wpływające na szybkość wykonywania rozkazów przez procesor.", a: "Głównie: Częstotliwość taktowania (GHz), architektura (CISC/RISC), ilość pamięci Cache (L1/L2/L3), liczba rdzeni, zjawisko potokowości (pipelining)." },
        { id: 14, isKnown: false, q: "Szeregowanie procesów, jakie algorytmy są stosowane.", a: "Decydowanie, któremu procesowi przydzielić CPU. Algorytmy: FCFS (kto pierwszy ten lepszy), SJF (najkrótsze zadanie pierwsze), Round Robin (rotacyjnie z określonym czasem, tzw. kwantem)." },
        { id: 15, isKnown: false, q: "Synchronizacja procesów - metody.", a: "Zapobiega konfliktom, gdy procesy korzystają z tych samych zasobów. Używa się: Mutexów (wzajemne wykluczanie - klucz do pokoju), Semaforów (licznik wolnych zasobów), Monitorów." },
        { id: 17, isKnown: false, q: "Strategie przydziału segmentów pamięci.", a: "First-Fit (pierwszy pasujący - szybkie, fragmentuje pamięć), Best-Fit (najlepiej pasujący - oszczędza pamięć, wolniej szuka), Worst-Fit (największy wolny blok - zostawia użyteczne duże 'resztki')." },
        { id: 18, isKnown: false, q: "System plików i jego realizacja.", a: "Sposób strukturalnej organizacji danych na nośnikach. Zarządza plikami, katalogami i metadanymi (uprawnienia, czas powstania). Przykłady: FAT32, NTFS, ext4." },
        { id: 19, isKnown: false, q: "Wyznaczanie trasy przez protokoły routingu dynamicznego.", a: "Rutery automatycznie wymieniają się 'tablicami routingu'. Na podstawie metryk (np. koszt łącza, ilość przeskoków) wyznaczają najszybszą ścieżkę dla pakietu." },
        { id: 20, isKnown: false, q: "Porównanie RIP oraz OSPF.", a: "RIP: stary, metryką jest ilość skoków (max 15), wolno reaguje na awarie. OSPF: nowoczesny, metryką jest stan/przepustowość łącza, ma bardzo szybką zbieżność i tworzy mapę topologii sieci." },
        { id: 22, isKnown: false, q: "Technologie w sieciach rozległych (WAN).", a: "Łączą sieci na dużych odległościach geograficznych. Technologie to m.in: MPLS (etykietowanie pakietów, szybkie), Frame Relay, VPN, czy współczesne sieci SD-WAN (sterowane programowo)." },
        { id: 23, isKnown: false, q: "Charakterystyka stosu protokołów TCP/IP.", a: "Baza działania internetu. Ma 4 warstwy (zamiast 7 jak w modelu OSI): 1. Aplikacji (HTTP, FTP), 2. Transportowa (TCP, UDP), 3. Internetowa/Sieciowa (IP, routing), 4. Dostępu do sieci (Ethernet)." },
        { id: 24, isKnown: false, q: "Działanie zdalnego wywoływania procedur (RPC).", a: "Technika ułatwiająca komunikację sieciową. Program na komputerze A wywołuje funkcję, która fizycznie wykonuje się na serwerze B (np. pobierzDaneKonta()). System ukrywa całą złożoność sieci przed programistą." },
        { id: 25, isKnown: false, q: "Co to paradygmat? Wymień przykłady.", a: "Paradygmat to ogólny wzorzec, styl tworzenia kodu. Przykłady: Obiektowy (klasy, obiekty), Strukturalny (instrukcje, bloki), Funkcyjny (czyste funkcje bez stanu, np. Haskell), Deklaratywny (piszesz CO ma się stać, np. SQL)." },
        { id: 26, isKnown: false, q: "Klasa w programowaniu obiektowym i jej składowe.", a: "Klasa to szablon lub 'foremka' z której tworzymy obiekty. Głównymi składowymi są POLA (zmienne, określają stan obiektu) oraz METODY (funkcje, określają zachowanie obiektu)." },
        { id: 27, isKnown: false, q: "Zjawisko polimorfizmu w programowaniu obiektowym.", a: "Wielopostaciowość. Pozwala wywołać tę samą metodę, ale jej działanie będzie zależało od tego, na jakim typie obiektu zostanie wywołana. Np. metoda .dajGłos() zadziała jako 'miau' dla Kota i 'hau' dla Psa, mimo bycia przypisaną do listy typu 'Zwierzę'." },
        { id: 28, isKnown: false, q: "Metody anonimowe i wyrażenia strzałkowe (lambda).", a: "To 'krótkie' funkcje bez nazwy, deklarowane w miejscu ich użycia. Świetne do przekazywania logiki jako parametru. W C# (lambda): (x, y) => x + y; (Zwraca sumę bez pisania całego słowa 'return')." },
        { id: 29, isKnown: false, q: "Scharakteryzuj krótko platformę .NET.", a: "Potężny framework Microsoftu. Cechy: wielojęzyczny (C#, F#), cross-platform, Posiada wirtualną maszynę CLR (Common Language Runtime), która kompiluje kod pośredni IL i posiada Garbage Collector zwalniający pamięć." },
        { id: 33, isKnown: false, q: "Etapy tworzenia animacji komputerowej.", a: "1. Modelowanie (budowa siatki 3D), 2. Riggowanie (tworzenie szkieletu, żeby model mógł się zginać), 3. Animowanie (ustawianie klatek kluczowych w czasie), 4. Oświetlenie i nakładanie materiałów, 5. Renderowanie (generowanie obrazu/wideo)." },
        { id: 34, isKnown: false, q: "Technologie prezentacji scen 3D na stronach www.", a: "WebGL: bazowe API graficzne przeglądarek (wykorzystuje kartę graficzną do 3D). WebXR (do AR/VR). Do ułatwienia pisania używa się bibliotek np. Three.js lub Babylon.js." },
        { id: 37, isKnown: false, q: "Własności i zastosowania sterowania rozmytego.", a: "Fuzzy Logic odchodzi od klasycznego wyjścia 0-1 (Prawda/Fałsz). Używa zbiorów rozmytych (wartości pośrednich, np. 'bardzo zimno', 'ciepło'). Zastosowania: Pralki (czas prania względem wagi i brudu), systemy ABS, klimatyzacja." },
        { id: 38, isKnown: false, q: "Czy drzewo decyzyjne jest metodą reprezentacji wiedzy?", a: "Tak, to formalna metoda reprezentacji. Składa się z węzłów (testujących jakiś atrybut, np. 'Czy pada deszcz?') oraz liści, które zawierają konkretne rozstrzygnięcia, reguły lub klasyfikacje (np. 'Nie idź na spacer')." },
        { id: 40, isKnown: false, q: "Model danych rozumiany jako architektura BD.", a: "To zbiór pojęć do opisu danych (struktury, typy), więzów integralności (zasady spójności danych) oraz operacji manipulowania (jak można dane dodawać, zmieniać i usuwać)." },
        { id: 41, isKnown: false, q: "Typy architektonicznych modeli danych.", a: "Relacyjny (tabele powiązane relacjami), Obiektowy, Hierarchiczny (drzewiasty), Sieciowy, a współcześnie również NoSQL: Dokumentowy (np. MongoDB - format JSON), Grafowy, Klucz-Wartość." },
        { id: 42, isKnown: false, q: "Trójpoziomowa architektura SBD (ANSI-SPARC).", a: "1. Poziom zewnętrzny: to co widzą poszczególni użytkownicy (Widoki). 2. Poziom pojęciowy (Logiczny): to centralny opis wszystkich danych i ich relacji. 3. Poziom wewnętrzny (Fizyczny): sposób fizycznego zapisu danych na dysku komputera." },
        { id: 43, isKnown: false, q: "Istota relacyjnego modelu danych.", a: "Podstawą jest matematyczne pojęcie relacji, reprezentowanej jako TABELA. Dane przechowuje się w wierszach. Tabele łączone są ze sobą za pomocą kluczy obcych wskazujących na klucze główne innych tabel (np. Tabela Klient łączy się z Tabelą Zamówienie)." },
        { id: 44, isKnown: false, q: "Elementy i funkcje jądra systemu zarządzania BD (DBMS).", a: "Jądro zarządza fizycznym dostępem do dysku. Odpowiada za: system transakcji (ACID), autoryzację bezpieczeństwa, buforowanie pamięci, utrzymanie spójności danych (lock manager) i optymalizację zapytań SQL." },
        { id: 45, isKnown: false, q: "Charakterystyka metody blokowania w BD (Locks).", a: "Mechanizm izolacji transakcji. Gdy transakcja A modyfikuje rekord X, zakłada na nim 'blokadę'. Transakcja B musi poczekać, aż A skończy. Zapobiega to utracie i nadpisywaniu jednoczesnych zmian (race conditions)." },
        { id: 46, isKnown: false, q: "Diagramy UML opisujące strukturę systemu.", a: "Diagramy strukturalne (statyczne): Diagram Klas (pokazuje klasy systemu i powiązania), Diagram Obiektów, Diagram Komponentów, Diagram Wdrożenia (pokazuje fizyczny sprzęt np. serwery i wgrane oprogramowanie)." },
        { id: 47, isKnown: false, q: "Diagramy UML opisujące zachowanie systemu.", a: "Diagramy behawioralne (dynamiczne w czasie): Diagram Przypadków Użycia (funkcje z punktu widzenia ludzika/aktora), Diagram Sekwencji (chronologiczna komunikacja), Diagram Aktywności (algorytm/przepływ pracy), Diagram Stanów." },
        { id: 48, isKnown: false, q: "Omów diagramy przypadków użycia z języka UML.", a: "Pokazują funkcjonalności systemu z punktu widzenia użytkownika. Elementy to Aktor, Przypadek Użycia (owal - akcja), System. Relacje: <<include>> - zawiera (akcja obowiązkowa), <<extend>> - rozszerza (akcja opcjonalna np. w przypadku błędu)." },
        { id: 49, isKnown: false, q: "Rodzaje testów w procesie wytwórczym.", a: "1. Jednostkowe (Unit Testy - najniższy poziom, testują małe wyizolowane metody). 2. Integracyjne (testują czy moduły ze sobą 'gadają'). 3. Systemowe (testują całą architekturę). 4. Akceptacyjne/UAT (testuje docelowy klient)." },
        { id: 50, isKnown: false, q: "Trzy modele cyklu życia systemu informatycznego.", a: "Kaskadowy (Waterfall) - fazy liniowe, jedna po drugiej. V-Model - rozszerzenie kaskady, każda faza tworzenia ma przypisaną od razu fazę testów. Zwinny (Agile/Scrum) - iteracyjny cykl, po każdym sprincie (np. 2 tyg.) dostarczamy działający fragment systemu." },
        { id: 51, isKnown: false, q: "Trzy elementy do budowy systemu wbudowanego (Embedded).", a: "1. Mikroprocesor/Mikrokontroler jako mózg, 2. Pamięć programu (ROM/Flash) oraz danych (RAM), 3. Peryferia wejścia/wyjścia komunikujące się ze światem zewnętrznym (np. czujniki, przyciski, wyświetlacze)." },
        { id: 52, isKnown: false, q: "Charakterystyka trzech elementów mikrokontrolera.", a: "To system w jednym układzie (SoC). Składa się z: rdzenia CPU (wykonuje program), zintegrowanej Pamięci (Flash na kod, SRAM na zmienne), wbudowanych Peryferiów (np. timery do odliczania czasu, przetworniki ADC czytające sygnał analogowy z czujników)." },
        { id: 53, isKnown: false, q: "Różnice między mikroprocesorem a mikrokontrolerem.", a: "Mikroprocesor to sam 'mózg' (tylko CPU) - potrzebuje płytki z zewnętrznym RAMem i dyskiem. Mikrokontroler to zintegrowany 'minikomputer w jednym chipie' - zawiera od razu CPU, pamięć, piny I/O (np. Arduino, STM32)." },
        { id: 54, isKnown: false, q: "Konsekwencje stosowania OS w systemach wbudowanych.", a: "Zwykle stosuje się RTOS (System Operacyjny Czasu Rzeczywistego). Zalety: ułatwia tworzenie zaawansowanego wielowątkowego kodu i jest deterministyczny. Wady: zużywa cenne zasoby (pamięć, taktowanie) co podnosi koszt urządzenia, zwiększa ryzyko błędów/zawieszenia." },
        { id: 63, isKnown: false, q: "Komputery kwantowe - przyszłość informatyki.", a: "Zamiast klasycznych bitów (0 lub 1) używają kubitów (dzięki superpozycji mogą być oboma stanami jednocześnie). Pozwala to na wykonywanie olbrzymiej liczby obliczeń równolegle (groźne dla dzisiejszej kryptografii RSA, np. szybki algorytm Shora)." },
    ];

    let filteredDb = [];
    let currentQuestions = [];
    let currentIndex = 0;
    let isTestMode = false;
    let onlyUnknown = true; // Domyślnie włączony filtr "To czego nie umiesz"

    function init() {
        applyFilter();
    }

    function toggleFilter() {
        onlyUnknown = !onlyUnknown;
        const btn = document.getElementById('btn-filter');
        if(onlyUnknown) {
            btn.classList.add('active');
            btn.innerText = "Tylko to, czego nie umiem";
        } else {
            btn.classList.remove('active');
            btn.innerText = "Wszystkie pytania (Włączony zbiór pełny)";
        }
        applyFilter();
    }

    function applyFilter() {
        filteredDb = onlyUnknown ? db.filter(item => !item.isKnown) : [...db];
        currentQuestions = [...filteredDb];
        currentIndex = 0;
        
        if(isTestMode) loadTestQuestion();
        else loadFlashcard();
    }

    function switchMode(mode) {
        isTestMode = mode === 'test';
        document.getElementById('btn-mode-flashcards').className = !isTestMode ? 'active' : '';
        document.getElementById('btn-mode-test').className = isTestMode ? 'active' : '';
        document.getElementById('flashcards-section').className = !isTestMode ? '' : 'hidden';
        document.getElementById('test-section').className = isTestMode ? 'test-container' : 'test-container hidden';
        if(isTestMode) loadTestQuestion();
        else loadFlashcard();
    }

    // --- Logika Fiszek ---
    function loadFlashcard() {
        if(currentQuestions.length === 0) return;
        const item = currentQuestions[currentIndex];
        document.getElementById('flashcard').classList.remove('is-flipped');
        
        // Timeout pozwala na zresetowanie animacji karty
        setTimeout(() => {
            document.getElementById('fc-title').innerText = `Pytanie ${item.id} / 67 (${currentIndex + 1} z widocznych)`;
            document.getElementById('fc-question').innerText = item.q;
            document.getElementById('fc-answer').innerText = item.a;
        }, 150);
    }
    
    function flipCard() { document.getElementById('flashcard').classList.toggle('is-flipped'); }

    // --- Logika Testu ---
    function loadTestQuestion() {
        if(currentQuestions.length === 0) return;
        const item = currentQuestions[currentIndex];
        document.getElementById('test-title').innerText = `Pytanie ${item.id} / 67 (${currentIndex + 1} z widocznych)`;
        document.getElementById('test-question').innerText = item.q;
        document.getElementById('test-next-btn').classList.add('hidden');
        
        // Generowanie dystraktorów z CAŁEJ bazy (żeby miały sens, nawet z tych co umiemy)
        let wrongAnswers = db.filter(x => x.id !== item.id).sort(() => 0.5 - Math.random()).slice(0, 3).map(x => x.a);
        let options = [{text: item.a, correct: true}, ...wrongAnswers.map(a => ({text: a, correct: false}))];
        options.sort(() => 0.5 - Math.random()); // tasowanie

        const grid = document.getElementById('test-options');
        grid.innerHTML = '';
        options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text.length > 200 ? opt.text.substring(0, 200) + '...' : opt.text;
            btn.onclick = () => checkAnswer(btn, opt.correct, grid, item.id);
            grid.appendChild(btn);
        });
    }

    function checkAnswer(btn, isCorrect, grid, currentId) {
        let buttons = grid.querySelectorAll('button');
        buttons.forEach(b => b.disabled = true);
        if(isCorrect) { btn.classList.add('correct'); } 
        else {
            btn.classList.add('wrong');
            let correctOpt = db.find(x => x.id === currentId).a;
            buttons.forEach(b => { 
                if(b.innerText.includes(correctOpt.substring(0, 30))) b.classList.add('correct'); 
            });
        }
        document.getElementById('test-next-btn').classList.remove('hidden');
    }

    function nextTestQuestion() { nextQuestion(); }

    // --- Nawigacja ---
    function nextQuestion() {
        if(currentQuestions.length === 0) return;
        currentIndex = (currentIndex + 1) % currentQuestions.length;
        isTestMode ? loadTestQuestion() : loadFlashcard();
    }
    function prevQuestion() {
        if(currentQuestions.length === 0) return;
        currentIndex = (currentIndex - 1 + currentQuestions.length) % currentQuestions.length;
        isTestMode ? loadTestQuestion() : loadFlashcard();
    }
    function shuffleQuestions() {
        if(currentQuestions.length === 0) return;
        currentQuestions.sort(() => Math.random() - 0.5);
        currentIndex = 0;
        isTestMode ? loadTestQuestion() : loadFlashcard();
    }

    // Obsługa klawiatury
    document.addEventListener('keydown', (e) => {
        if(!isTestMode) {
            if(e.key === 'ArrowRight') nextQuestion();
            if(e.key === 'ArrowLeft') prevQuestion();
            if(e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
        }
    });

    init();
</script>
</body>
</html>
